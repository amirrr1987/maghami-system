info:
  name: Hello
  type: http
  seq: 1
  tags:
    - health
    - public

http:
  method: GET
  url: "{{baseUrl}}/"
  auth:
    type: none

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccess
      operator: eq
      value: "true"
    - expression: res.body.data
      operator: eq
      value: Hello from API

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Public health check. ApiResult with `data: "Hello from API"` and
  `message: ["Retrieved successfully"]`.
