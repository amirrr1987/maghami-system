info:
  name: Delete product
  type: http
  seq: 5
  tags:
    - products
    - crud

http:
  method: DELETE
  url: "{{baseUrl}}/products/:id"
  params:
    - name: id
      value: "{{productId}}"
      type: path
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccess
      operator: eq
      value: "true"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Returns 200 ApiResult without data.
