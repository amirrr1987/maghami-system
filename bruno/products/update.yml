info:
  name: Update product
  type: http
  seq: 4
  tags:
    - products
    - crud

http:
  method: PATCH
  url: "{{baseUrl}}/products/:id"
  params:
    - name: id
      value: "{{productId}}"
      type: path
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Sample product (updated)",
        "price": 24.0
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
