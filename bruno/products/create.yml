info:
  name: Create product
  type: http
  seq: 3
  tags:
    - products
    - crud

http:
  method: POST
  url: "{{baseUrl}}/products"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "sku": "BRUNO-SKU-001",
        "name": "Sample product",
        "categoryId": "{{categoryId}}",
        "description": "Created from Bruno",
        "price": 19.5,
        "isActive": true
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const data = res.body && res.body.data;
        const id = data && data.id;
        if (typeof id === "string" && id.length > 0) {
          bru.setEnvVar("productId", id);
        }
    - type: tests
      code: |-
        test("creates a product", function () {
          expect(res.status).to.equal(200);
          expect(res.body.isSuccess).to.equal(true);
          expect(res.body.data.id).to.be.a("string");
          expect(res.body.data.sku).to.equal("BRUNO-SKU-001");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Requires `categoryId` (create a category first). Saves `productId` from `data.id`. Duplicate `sku` → 409.
