info:
  name: Set role permissions
  type: http
  seq: 5
  tags:
    - roles

http:
  method: PUT
  url: "{{baseUrl}}/roles/:id/permissions"
  params:
    - name: id
      value: "{{roleValue}}"
      type: path
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "permissionIds": ["{{permissionId}}"]
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Replaces the full permission set. Run Permissions → Create first (`permissionId`).
  Empty list: `{ "permissionIds": [] }`.
