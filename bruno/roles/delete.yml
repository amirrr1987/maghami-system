info:
  name: Delete role
  type: http
  seq: 6
  tags:
    - roles
    - crud

http:
  method: DELETE
  url: "{{baseUrl}}/roles/:id"
  params:
    - name: id
      value: "{{roleValue}}"
      type: path
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccess
      operator: eq
      value: "true"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Cannot delete `super-admin`. Returns 200 ApiResult without data.
