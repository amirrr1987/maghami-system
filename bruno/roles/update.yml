info:
  name: Update role
  type: http
  seq: 4
  tags:
    - roles
    - crud

http:
  method: PATCH
  url: "{{baseUrl}}/roles/:id"
  params:
    - name: id
      value: "{{roleValue}}"
      type: path
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "label": "Operator (updated)",
        "description": "Updated from Bruno"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Cannot update `super-admin`. `:id` is the current slug.
