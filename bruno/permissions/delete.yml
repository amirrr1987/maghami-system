info:
  name: Delete permission
  type: http
  seq: 5
  tags:
    - permissions
    - crud

http:
  method: DELETE
  url: "{{baseUrl}}/permissions/:id"
  params:
    - name: id
      value: "{{permissionId}}"
      type: path
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.isSuccess
      operator: eq
      value: "true"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Returns 200 with ApiResult (no data). Run Create first so `permissionId` is set.
