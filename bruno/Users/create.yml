info:
  name: Create user
  type: http
  seq: 3
  tags:
    - users
    - crud

http:
  method: POST
  url: "{{baseUrl}}/users"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "operator@localhost.ir",
        "name": "Operator",
        "password": "password12",
        "isActive": true,
        "roleIds": []
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const data = res.body && res.body.data;
        const id = data && data.id;
        if (typeof id === "string" && id.length > 0) {
          bru.setEnvVar("userId", id);
        }
    - type: tests
      code: |-
        test("creates a user", function () {
          expect(res.status).to.equal(200);
          expect(res.body.isSuccess).to.equal(true);
          expect(res.body.data.id).to.be.a("string");
          expect(res.body.data.email).to.equal("operator@localhost.ir");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Saves `userId` from `data.id`. Password min 8. `roleIds` are role slugs, not UUIDs.
  Use a different email than the logged-in admin. Duplicate email → 409.
