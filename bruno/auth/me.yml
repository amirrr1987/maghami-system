info:
  name: Get me
  type: http
  seq: 4
  tags:
    - auth

http:
  method: GET
  url: "{{baseUrl}}/auth/me"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Current user, CASL `abilities`, and catalog `permissionCodes`.
