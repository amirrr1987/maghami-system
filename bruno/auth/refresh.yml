info:
  name: Refresh tokens
  type: http
  seq: 2
  tags:
    - auth
    - public

http:
  method: POST
  url: "{{baseUrl}}/auth/refresh"
  headers:
    - name: Authorization
      value: ""
      disabled: true
  body:
    type: none
  auth:
    type: none

runtime:
  scripts:
    - type: before-request
      code: |-
        try {
          req.setHeader("Authorization", "");
        } catch (e) {}
    - type: after-response
      code: |-
        const data = res.body && res.body.data;
        if (data && typeof data.accessToken === "string" && data.accessToken.length > 0) {
          bru.setEnvVar("accessToken", data.accessToken, { persist: true });
          bru.setVar("accessToken", data.accessToken);
        }
    - type: tests
      code: |-
        test("refresh rotates access from cookie", function () {
          expect(res.status).to.equal(200);
          expect(res.body.isSuccess).to.equal(true);
          expect(res.body.data.accessToken).to.be.a("string").and.not.empty;
          expect(res.body.data.refreshToken).to.equal(undefined);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Public. Uses HttpOnly `maghami-system_refresh` cookie from Login (no body).
  Run Login first with cookie jar enabled.
