info:
  name: Logout
  type: http
  seq: 3
  tags:
    - auth
    - public

http:
  method: POST
  url: "{{baseUrl}}/auth/logout"
  headers:
    - name: Authorization
      value: ""
      disabled: true
  body:
    type: none
  auth:
    type: none

runtime:
  scripts:
    - type: before-request
      code: |-
        try {
          req.setHeader("Authorization", "");
        } catch (e) {}
    - type: after-response
      code: |-
        bru.deleteEnvVar("accessToken");
        bru.setVar("accessToken", "");
    - type: tests
      code: |-
        test("logout clears refresh cookie", function () {
          expect(res.status).to.equal(200);
          expect(res.body.isSuccess).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Public. Clears the HttpOnly refresh cookie. Also drops local accessToken vars.
